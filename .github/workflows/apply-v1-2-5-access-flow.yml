name: Apply v1.2.5 access flow

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-v1-2-5-access-flow.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply v1.2.5 source changes
        run: python scripts/apply-v125.py
      - name: Verify
        run: |
          npm run build
          npm run test:core
          npm run check
          npm run test:browser
      - name: Commit v1.2.5
        shell: bash
        run: |
          git config user.name 'RafMStudio'
          git config user.email 'acadeloop@gmail.com'
          git add CHANGELOG.md package.json index.source.html src/app.js src/backend.js src/styles.css scripts/browser-smoke.js scripts/check-project.js supabase/functions/admin-create-user/index.ts supabase/migrations/20260911_department_wide_program_access.sql index.html
          git add -f dist/index.html
          git rm scripts/apply-v125.py .github/workflows/apply-v1-2-5-access-flow.yml
          git diff --cached --check
          git commit -m 'Separate academic years from program access'
          git push origin HEAD:main
