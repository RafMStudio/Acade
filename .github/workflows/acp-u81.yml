name: ArabClinPack U8.1 Final
on:
  push:
    branches: [arabclinpack-e2e-20260918]
    paths:
      - 'e2e/acp_u81_final.py'
      - '.github/workflows/acp-u81.yml'
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    permissions:
      actions: read
      contents: read
    env:
      TOKENIZERS_PARALLELISM: "false"
      HF_HUB_DISABLE_XET: "1"
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Restore frozen U8 dictionary
        run: |
          gh api /repos/${GITHUB_REPOSITORY}/actions/artifacts/10539096336/zip > /tmp/u8.zip
          unzip -o /tmp/u8.zip -d e2e/
          test -f e2e/acp_u8_dictionary.json
      - run: |
          python -m pip install --upgrade pip
          pip install "torch==2.7.1" --index-url https://download.pytorch.org/whl/cpu
          pip install "transformers>=4.48,<4.58" accelerate sentencepiece protobuf
      - run: python e2e/acp_u81_final.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acp-u81-final-results
          path: e2e/acp_u81_results.json
          if-no-files-found: warn
