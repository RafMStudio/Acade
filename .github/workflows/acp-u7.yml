name: ArabClinPack U7 Phrase Mine
on:
  push:
    branches: [arabclinpack-e2e-20260918]
    paths:
      - 'e2e/acp_u7_phrase_mine.py'
      - '.github/workflows/acp-u7.yml'
jobs:
  u7:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      TOKENIZERS_PARALLELISM: "false"
      HF_HUB_DISABLE_XET: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          python -m pip install --upgrade pip
          pip install "torch==2.7.1" --index-url https://download.pytorch.org/whl/cpu
          pip install "transformers>=4.48,<4.58" accelerate sentencepiece sacremoses tiktoken protobuf
      - run: python e2e/acp_u7_phrase_mine.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acp-u7-results
          path: |
            e2e/acp_u7_results.json
            e2e/acp_u7_dictionary.json
          if-no-files-found: warn
