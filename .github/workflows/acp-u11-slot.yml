name: ArabClinPack U11 Slot Lock
on:
  push:
    branches: [arabclinpack-e2e-20260918]
    paths: ['e2e/acp_u11_slotlock.py','.github/workflows/acp-u11-slot.yml']
jobs:
  slot:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env: {TOKENIZERS_PARALLELISM: "false", HF_HUB_DISABLE_XET: "1"}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: |
          python -m pip install --upgrade pip
          pip install "torch==2.7.1" --index-url https://download.pytorch.org/whl/cpu
          pip install "transformers>=4.52,<4.58" accelerate sentencepiece protobuf
      - run: python e2e/acp_u11_slotlock.py
      - if: always()
        uses: actions/upload-artifact@v4
        with: {name: acp-u11-slotlock, path: e2e/acp_u11_slotlock.json}
