name: ArabClinPack Universal v4
on:
  push:
    branches: [arabclinpack-e2e-20260918]
    paths:
      - 'e2e/acp_u4_benchmark.py'
      - '.github/workflows/acp-u4.yml'
  workflow_dispatch:
jobs:
  universal-test:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      TOKENIZERS_PARALLELISM: "false"
      HF_HUB_DISABLE_XET: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install runtime
        run: |
          python -m pip install --upgrade pip
          pip install "torch==2.5.1" --index-url https://download.pytorch.org/whl/cpu
          pip install "transformers>=4.48,<4.58" accelerate sentencepiece tiktoken
      - name: Run universal multi-model benchmark
        run: python e2e/acp_u4_benchmark.py
      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acp-u4-results
          path: e2e/acp_u4_results.json
          if-no-files-found: warn
