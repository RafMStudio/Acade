name: Deploy EduItqan

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify Cloudflare deployment configuration
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Cloudflare deployment credentials are not configured in repository Actions secrets."
            exit 1
          fi
          echo "Cloudflare deployment credentials are configured."
      - name: Install dependencies
        run: npm install
      - name: Run security and regression checks
        run: |
          npm run build
          npm run test:core
          npm run test:security
          npm run test:i18n
          npm run check
      - name: Deploy to Cloudflare
        run: npx wrangler deploy
