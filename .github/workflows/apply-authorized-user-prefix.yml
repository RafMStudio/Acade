name: Apply authorized user prefix update

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-authorized-user-prefix.yml'

permissions:
  contents: write

jobs:
  apply-prefix:
    runs-on: ubuntu-latest
    env:
      PATCH_B64: >-
        
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply tested prefix patch
        shell: bash
        run: |
          echo "$PATCH_B64" | base64 -d | gzip -d > /tmp/prefix.patch
          patch -p1 < /tmp/prefix.patch
      - name: Rebuild and verify
        run: |
          npm run build
          npm run test:core
          npm run check
          npm run test:browser
      - name: Commit update
        shell: bash
        run: |
          git config user.name 'OpenAI'
          git config user.email 'noreply@openai.com'
          git rm .github/workflows/apply-authorized-user-prefix.yml
          git add CHANGELOG.md package.json scripts/browser-smoke.js scripts/check-project.js src/app.js src/backend.js index.html supabase/functions/admin-create-user/index.ts supabase/migrations/20260910_authorized_user_title_prefix.sql
          git add -f dist/index.html
          git diff --cached --check
          git commit -m 'Add authorized user title prefixes'
          git push origin HEAD:main
