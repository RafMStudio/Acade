name: Apply APU and VDAA supervisor roles

on:
  push:
    paths:
      - '.github/workflows/apply-supervisor-roles.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply supervisor role patch
        run: python scripts/patch-supervisors-v2.py
      - name: Install dependencies
        run: npm install
      - name: Build and test
        run: |
          npm run build
          npm run test:core
          npm run test:security
          node --test tests/supervisor.test.js
          npm run check
      - name: Commit application patch
        run: |
          git config user.name "RafMStudio"
          git config user.email "acadeloop@gmail.com"
          git add src/app.js tests/supervisor.test.js
          if git diff --cached --quiet; then
            echo "Supervisor patch already present"
          else
            git commit -m "Add APU and VDAA supervision dashboard"
            git push
          fi