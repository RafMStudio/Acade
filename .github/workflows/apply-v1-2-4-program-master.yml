    const rows=programDirectory.map(p=>`<tr><td><strong>${esc(p.code)}</strong><div class="tiny">${esc(p.name)}</div></td><td><span class="tag blue">${esc(programTypeLabel(p))}</span></td><td>${esc(p.department||'—')}</td><td>${esc(p.institution||'—')}</td><td>${esc(p.college||'—')}</td><td>${esc(p.current_academic_year)}</td><td>${statusPill(p.status)}</td><td><button class="btn btn-ghost" data-program-toggle="${p.id}" data-program-status="${p.status}">${p.status==='Open'?'Close':'Open'}</button></td></tr>`).join('');
    return roleHero()+pageHead('System administration','Academic Programs','This is the master list for departments and academic programs. Saved values automatically become available in the Add User dropdowns.')+`<div class="user-admin-grid"><div class="table-card"><table class="data-table"><thead><tr><th>Academic program</th><th>Type</th><th>Department</th><th>Institution</th><th>College</th><th>Year</th><th>Status</th><th></th></tr></thead><tbody>${rows||'<tr><td colspan="8" class="empty">No academic programs yet. Add the first program to populate the user assignment dropdowns.</td></tr>'}</tbody></table></div><div class="card user-add-card"><h3>Add academic program</h3><p>Enter the department and program once here. Existing values appear as suggestions, and saved records become dropdown options when adding users.</p><div class="form-grid"><div class="field f12"><label>Department *</label><input id="apDepartment" list="apDepartmentList" placeholder="e.g. Health Information Management" autocomplete="off"><datalist id="apDepartmentList">${departmentSuggestions}</datalist><span class="tiny">Type a new department or reuse one already saved.</span></div><div class="field f8"><label>Academic program *</label><input id="apName" list="apProgramNameList" placeholder="e.g. Health Information and Technology Management" autocomplete="off"><datalist id="apProgramNameList">${programSuggestions}</datalist></div><div class="field f4"><label>Program type *</label><select id="apProgramType"><option value="">Select type</option>${PROGRAM_TYPES.map(type=>`<option value="${esc(type)}">${esc(type)}</option>`).join('')}</select></div><div class="field f4"><label>Program code *</label><input id="apCode" placeholder="BHIM" autocomplete="off"></div><div class="field f8"><label>Current academic year *</label><input id="apYear" value="2026–2027" autocomplete="off"></div><div class="field f12"><label>Institution</label><input id="apInstitution" autocomplete="off"></div><div class="field f12"><label>College</label><input id="apCollege" autocomplete="off"></div><div class="field f12"><button class="btn btn-primary" id="createAcademicProgram" style="width:100%">Add academic program</button></div></div></div></div>`;
  }
'''+s[b:]
          a=s.index('  async function addAuthorizedUser(){')
          b=s.index('  async function setUserStatus(',a)
          s=s[:a]+'''  async function addAuthorizedUser(){
    const isAdmin=state.role==='System Administrator';
    const titlePrefix=normalizeTitlePrefix($('auPrefix')?.value),first=$('auFirst')?.value.trim(),last=$('auLast')?.value.trim(),role=$('auRole')?.value,email=$('auEmail')?.value.trim().toLowerCase();
    const selectedDepartment=isAdmin?$('auDepartment')?.value.trim():(state.program.department||'').trim();
    const programId=isAdmin?$('auProgram')?.value:activeProgramId;
    const matchedProgram=programDirectory.find(p=>p.id===programId);
    const department=(matchedProgram?.department||selectedDepartment||'').trim();
    if(!titlePrefix||!first||!last||!department||!email||(backendEnabled&&!programId)){toast('Prefix, first name, last name, department, role, email, and academic program are required.');return;}
    if(isAdmin&&backendEnabled&&(!matchedProgram||matchedProgram.status!=='Open')){toast('Select an open academic program from the Academic Programs list.');return;}
    if(isAdmin&&matchedProgram&&selectedDepartment!==matchedProgram.department){toast('The selected academic program does not belong to that department.');return;}
    if(!$('auEmail')?.checkValidity()){toast('Enter a valid email address.');return;}
    const allowed=isAdmin?['HOD','Coordinator','Instructor']:['Instructor','Coordinator'];if(!allowed.includes(role)){toast('That role is not permitted here.');return;}
    const btn=$('addAuthorizedUser');if(btn){btn.disabled=true;btn.textContent='Adding…'}
    try{if(!backendEnabled){const users=loadLocalUsers();if(users.some(u=>String(u.email||'').toLowerCase()===email))throw new Error('This email is already authorized.');users.push({id:uid(),titlePrefix,firstName:first,lastName:last,department,role,email,active:true,createdAt:nowDate()});saveLocalUsers(users);userDirectory=users;}else{await Backend.invoke('admin-create-user',{title_prefix:titlePrefix,first_name:first,last_name:last,department,role,email,program_id:programId});await loadUsers();}render();toast('User added and assigned. They can sign in from their authorized email.');}catch(e){toast(e?.message||'Could not add user.');}finally{if(btn){btn.disabled=false;btn.textContent='Add / assign user'}}
  }
