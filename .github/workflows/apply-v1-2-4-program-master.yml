          s=s[:a]+'''  async function createAcademicProgram(){
    const code=$('apCode')?.value.trim().toUpperCase(),name=$('apName')?.value.trim(),programType=normalizeProgramType($('apProgramType')?.value),institution=$('apInstitution')?.value.trim()||'',college=$('apCollege')?.value.trim()||'',department=$('apDepartment')?.value.trim(),year=$('apYear')?.value.trim();
    if(!code||!name||!programType||!department||!year){toast('Department, academic program, program type, program code, and academic year are required.');return;}
    if(programDirectory.some(p=>String(p.code||'').trim().toLowerCase()===code.toLowerCase())){toast('That program code already exists.');return;}
    if(programDirectory.some(p=>String(p.name||'').trim().toLowerCase()===name.toLowerCase()&&String(p.department||'').trim().toLowerCase()===department.toLowerCase())){toast('That academic program already exists in this department.');return;}
    const btn=$('createAcademicProgram');btn.disabled=true;btn.textContent='Adding…';
    try{await Backend.insert('academic_programs',{code,name,program_type:programType,institution,college,department,status:'Open',current_academic_year:year,data:{academicYears:[year],programType},created_by:currentUser.id});await loadPrograms();render();toast('Academic program added. Its department and program are now available in the Users dropdowns.');}catch(e){toast(e?.message||'Could not create academic program.');}finally{if($('createAcademicProgram')){$('createAcademicProgram').disabled=false;$('createAcademicProgram').textContent='Add academic program';}}
  }
'''+s[b:]
          old="    if($('auProgram')){\n      const syncDepartmentFromProgram=()=>{const program=findProgramFromInput($('auProgram').value);if(program&&$('auDepartment')&&!$('auDepartment').value.trim())$('auDepartment').value=program.department||'';};\n      $('auProgram').addEventListener('change',syncDepartmentFromProgram);\n      $('auProgram').addEventListener('blur',syncDepartmentFromProgram);\n    }\n"
          new="    if(state.role==='System Administrator'&&$('auDepartment')&&$('auProgram')){\n      const refreshProgramOptions=()=>{const department=$('auDepartment').value;const programs=programDirectory.filter(p=>p.status==='Open'&&p.department===department);$('auProgram').innerHTML=`<option value=\"\">${department?(programs.length?'Select academic program':'No open programs in this department'):'Select department first'}</option>${programs.map(p=>`<option value=\"${esc(p.id)}\">${esc(programDirectoryLabel(p))} · ${esc(programTypeLabel(p))}</option>`).join('')}`;$('auProgram').disabled=!department||programs.length===0;};\n      $('auDepartment').addEventListener('change',refreshProgramOptions);refreshProgramOptions();\n    }\n"
          s=s.replace(old,new)
          s=s.replace("const pg=programRows?.[0];if(pg){base.program={...base.program,name:pg.name,department:pg.department,college:pg.college,institution:pg.institution,academicYear:pg.current_academic_year};", "const pg=programRows?.[0];if(pg){base.program={...base.program,name:pg.name,programType:programTypeLabel(pg),department:pg.department,college:pg.college,institution:pg.institution,academicYear:pg.current_academic_year};")
          app.write_text(s)

          seed=root/'src/seed.js'; x=seed.read_text(); x=x.replace("name:'Bachelor of Health Information Management',academicYear", "name:'Bachelor of Health Information Management',programType:'Bachelor',academicYear"); seed.write_text(x)
          fn=root/'supabase/functions/admin-create-user/index.ts'; f=fn.read_text().replace('const department=String(body.department||"").trim();','const requestedDepartment=String(body.department||"").trim();').replace('select("id,status,department")','select("id,status,department,program_type")').replace('if(!program) return reply(404,{error:"Academic program not found"});','if(!program) return reply(404,{error:"Academic program not found"});\n  if(program.status!=="Open") return reply(400,{error:"Academic program is closed"});\n  const department=String(program.department||"").trim();\n  if(requestedDepartment&&requestedDepartment!==department) return reply(400,{error:"Department does not match the selected academic program"});'); fn.write_text(f)
          (root/'supabase/migrations/20260910_academic_program_type.sql').write_text("alter table public.academic_programs\n  add column if not exists program_type text not null default 'Bachelor';\n\nalter table public.academic_programs\n  drop constraint if exists academic_programs_program_type_check;\n\nalter table public.academic_programs\n  add constraint academic_programs_program_type_check\n  check (program_type in ('Diploma', 'Bachelor'));\n")
          pkg=root/'package.json'; pkg.write_text(pkg.read_text().replace('"version": "1.2.3"','"version": "1.2.4"'))
          chg=root/'CHANGELOG.md'; c=chg.read_text(); entry="\n### 1.2.4 — Academic Programs master list\n- Academic Programs is now the master source for Department and Academic Program assignments.\n- Added required Program Type with Diploma and Bachelor options.\n- Saved departments and programs immediately populate the Add User dropdowns.\n- Add User now uses strict Department and Academic Program dropdowns instead of free-text entry.\n- Academic Program choices are filtered by the selected Department and include the program type.\n\n"; chg.write_text(c[:c.find('\n')+1]+entry+c[c.find('\n')+1:])
          chk=root/'scripts/check-project.js'; c=chk.read_text().replace("assert.ok(app.includes('id=\"auProgram\" list=\"auProgramList\"'), 'SystemAdmin academic program entry must be writable');\nassert.ok(app.includes('id=\"auDepartment\"'), 'Authorized-user department entry is missing');", "assert.ok(app.includes('<select id=\"auDepartment\"') && app.includes('<select id=\"auProgram\"'), 'Department and academic program must be dropdowns');\nassert.ok(app.includes(\"const PROGRAM_TYPES = ['Diploma','Bachelor']\"), 'Academic program type options are missing');\nassert.ok(app.includes('id=\"apProgramType\"'), 'Program type selector is missing');\nassert.ok(app.includes('program_type:programType'), 'Program type is not persisted');"); chk.write_text(c)
          smoke=root/'scripts/browser-smoke.js'; b=smoke.read_text().replace("  await expect('SystemAdmin program field is writable', \"document.getElementById('auProgram').tagName\", 'INPUT');\n  await expect('SystemAdmin department field is writable', \"document.getElementById('auDepartment').disabled||document.getElementById('auDepartment').readOnly\", false);", "  await expect('SystemAdmin department is a dropdown', \"document.getElementById('auDepartment').tagName\", 'SELECT');\n  await expect('SystemAdmin academic program is a dropdown', \"document.getElementById('auProgram').tagName\", 'SELECT');"); smoke.write_text(b)
