name: Apply v1.2.4 Academic Programs master list

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-v1-2-4-program-master.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply v1.2.4 source changes
        run: python scripts/apply-v124.py
      - name: Verify
        run: |
          npm run build
          npm run test:core
          npm run check
          npm run test:browser
      - name: Commit v1.2.4
        shell: bash
        run: |
          git config user.name 'RafMStudio'
          git config user.email 'acadeloop@gmail.com'
          git add CHANGELOG.md package.json scripts/browser-smoke.js scripts/check-project.js src/app.js src/seed.js supabase/functions/admin-create-user/index.ts supabase/migrations/20260910_academic_program_type.sql index.html
          git add -f dist/index.html
          git rm scripts/apply-v124.py .github/workflows/apply-v1-2-4-program-master.yml
          git diff --cached --check
          git commit -m 'Make Academic Programs the assignment master list'
          git push origin HEAD:main
