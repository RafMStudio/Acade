name: Apply v1.2.6 keepalive UI

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-v1-2-6-keepalive.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply v1.2.6 source changes
        run: python scripts/apply-v126.py
      - name: Verify standard CI gate
        run: |
          npm run build
          npm run test:core
          npm run check
      - name: Commit v1.2.6
        shell: bash
        run: |
          git config user.name 'RafMStudio'
          git config user.email 'acadeloop@gmail.com'
          git add CHANGELOG.md package.json src/app.js scripts/check-project.js index.html
          git add -f dist/index.html
          git rm scripts/apply-v126.py .github/workflows/apply-v1-2-6-keepalive.yml
          git diff --cached --check
          git commit -m 'Add Supabase project heartbeat status'
          git push origin HEAD:main
