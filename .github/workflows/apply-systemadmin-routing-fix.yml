name: Apply SystemAdmin routing fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-systemadmin-routing-fix.yml'

permissions:
  contents: write

jobs:
  apply-fix:
    if: github.repository == 'RafMStudio/Acade'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply prepared v1.2.1 source patch
        shell: bash
        run: |
          cat > /tmp/systemadmin.patch.gz.b64 <<'PATCH_B64'

PATCH_B64
          base64 -d /tmp/systemadmin.patch.gz.b64 | gzip -d > /tmp/systemadmin.patch
          git apply --check /tmp/systemadmin.patch
          git apply /tmp/systemadmin.patch
      - name: Rebuild and verify
        run: |
          npm run build
          npm run test:core
          npm run check
      - name: Commit routing fix
        shell: bash
        run: |
          git config user.name 'OpenAI'
          git config user.email 'noreply@openai.com'
          git rm .github/workflows/apply-systemadmin-routing-fix.yml
          git add CHANGELOG.md SUPABASE_INTEGRATION.md TEST_RESULTS.md package.json scripts/browser-smoke.js scripts/check-project.js src/app.js src/backend.js index.html dist/index.html
          git diff --cached --check
          git commit -m 'Fix SystemAdmin routing'
          git push origin HEAD:main
