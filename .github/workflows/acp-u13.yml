name: ArabClinPack U13 Anchor
on:
  push:
    branches: [arabclinpack-e2e-20260918]
    paths: ['e2e/acp_u13_anchor.py','.github/workflows/acp-u13.yml']
jobs:
  anchor:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env: {TOKENIZERS_PARALLELISM: "false", HF_HUB_DISABLE_XET: "1"}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: |
          python -m pip install --upgrade pip
          pip install "transformers>=4.52,<4.58" sentencepiece protobuf
      - run: python e2e/acp_u13_anchor.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acp-u13-anchor
          path: e2e/acp_u13_anchor.json
