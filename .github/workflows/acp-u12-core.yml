name: ArabClinPack U12 Core Safety
on:
  push:
    branches: [arabclinpack-e2e-20260918]
    paths: ['e2e/acp_u12_core.py','.github/workflows/acp-u12-core.yml']
jobs:
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env: {TOKENIZERS_PARALLELISM: "false", HF_HUB_DISABLE_XET: "1"}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: |
          python -m pip install --upgrade pip
          pip install "transformers>=4.52,<4.58" sentencepiece protobuf
      - run: python e2e/acp_u12_core.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acp-u12-core
          path: e2e/acp_u12_core_test.json
